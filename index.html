<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <title>印前检查-雪糕</title>
  <link rel="stylesheet" href="./css/style.css?v=20261016g"/>
</head>
<body>
  <header class="topbar">
    <div class="title"><span class="tname">印前检查-雪糕</span><span class="ver">v11.0</span></div>
    <!-- v10.0: 设置齿轮(卡片开关收进弹层, 不再常驻一行) -->
    <span class="top-actions">
      <button id="btnSet" class="btn-gear" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94 7.07 7.07 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.72 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z" fill="currentColor"/></svg></button>
      <!-- v10.41: 顶栏「全部清理」按钮(btnAll, v10.12 引入)已移除 ——
           雪糕: 核心想法是"点一遍各卡的红色按钮", 索性去掉这枚聚合入口;
           且它与各卡开关的门控一直对不齐(色板卡默认关却仍被执行)。 -->
      <button id="btnRun" class="btn">开始检查</button>
    </span>
  </header>

  <div id="loading" class="loading hidden">正在扫描…</div>
  <div id="notice" class="notice hidden"></div>
  <div id="error" class="error hidden"></div>
  
  <div id="results" class="results"></div>

  <footer class="foot" id="foot"></footer>

  <!-- 自定义确认框(黑色主题,替代原生 confirm) -->
  <div id="modalMask" class="modal-mask hidden">
    <div class="modal">
      <div class="modal-title" id="modalTitle">提示</div>
      <div class="modal-msg" id="modalMsg"></div>
      <div class="modal-btns">
        <button class="modal-btn modal-cancel" id="modalCancel">取消</button>
        <button class="modal-btn modal-ok" id="modalOk">确定</button>
      </div>
    </div>
  </div>

  <!-- v10.0: 设置弹层 —— 卡片开关(勾选行由 main.js 按真实卡序生成, 避免卡片名两处维护) -->
  <div id="setMask" class="modal-mask hidden">
    <div class="modal set-modal">
      <div class="modal-title">设置</div>
      <!-- v10.1: 卡片开关 + 拖动排序(勾选行与阈值行均由 main.js 生成) -->
      <div class="set-sub">卡片开关 / 顺序 · 关掉的卡本轮不检查，可明显提速</div>
      <div class="set-list" id="setList"></div>
      <div class="set-sub">判定阈值 · 默认由插件维护，此处改动对所有检查生效</div>
      <div class="set-th" id="setTh"></div>
      <div class="set-hint">改动后点「确认」保存，点「关闭」放弃</div>
      <!-- v10.1: 确认(落盘草稿) / 重置默认(开关+顺序+阈值) / 关闭(丢弃未确认的改动)
           v10.2: 「重置默认」改成**点下即重置**(去掉确认弹窗), 那句提醒挪到 title 悬停提示
           v10.37: 设置弹层改**整体草稿式** —— 开关/顺序/叠印版本原先点下即落盘, 导致「关闭」
                   关掉后改动照样生效(雪糕反馈)。现四项统一: 「确认」落盘 / 「关闭」整体回滚。 -->
      <div class="modal-btns">
        <button class="modal-btn modal-reset" id="setReset" title="立即把卡片开关、卡片顺序、判定阈值全部恢复为默认值">重置默认</button>
        <span class="set-gap"></span>
        <button class="modal-btn modal-cancel" id="setClose">关闭</button>
        <button class="modal-btn modal-ok" id="setOk">确认</button>
      </div>
    </div>
  </div>

  <script src="./js/main.js?v=20261016g"></script>
</body>
</html>
