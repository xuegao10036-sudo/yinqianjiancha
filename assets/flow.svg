<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 128" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="660" height="128" fill="#151517"/>
  <!-- 步骤框 -->
  <g>
    <rect x="8"   y="30" width="138" height="68" rx="10" fill="#1b1b1c" stroke="#3a3a3a"/>
    <rect x="180" y="30" width="138" height="68" rx="10" fill="#1b1b1c" stroke="#3a3a3a"/>
    <rect x="352" y="30" width="138" height="68" rx="10" fill="#1b1b1c" stroke="#3a3a3a"/>
    <rect x="524" y="30" width="138" height="68" rx="10" fill="#1b1b1c" stroke="#3a3a3a"/>
  </g>
  <!-- 步骤号 -->
  <g font-size="10" text-anchor="middle">
    <rect x="20"  y="40" width="16" height="16" rx="8" fill="#0e639c"/><text x="28"  y="51" fill="#ffffff">1</text>
    <rect x="192" y="40" width="16" height="16" rx="8" fill="#0e639c"/><text x="200" y="51" fill="#ffffff">2</text>
    <rect x="364" y="40" width="16" height="16" rx="8" fill="#0e639c"/><text x="372" y="51" fill="#ffffff">3</text>
    <rect x="536" y="40" width="16" height="16" rx="8" fill="#0e639c"/><text x="544" y="51" fill="#ffffff">4</text>
  </g>
  <!-- 步骤文字 -->
  <g font-size="12" font-weight="600" fill="#d8d8d8">
    <text x="20"  y="72">安装</text>
    <text x="192" y="72">打开面板</text>
    <text x="364" y="72">开始检查</text>
    <text x="536" y="72">处理结果</text>
  </g>
  <g font-size="10" fill="#999999">
    <text x="20"  y="88">双击 安装.bat</text>
    <text x="192" y="88">窗口 → 扩展功能</text>
    <text x="364" y="88">顶栏「开始检查」</text>
    <text x="536" y="88">转曲 / 嵌入 / 清叠印</text>
  </g>
  <!-- 箭头 -->
  <g stroke="#4a4a4a" stroke-width="1.5" fill="none">
    <line x1="148" y1="64" x2="172" y2="64"/>
    <line x1="320" y1="64" x2="344" y2="64"/>
    <line x1="492" y1="64" x2="516" y2="64"/>
  </g>
  <g fill="#4a4a4a">
    <path d="M 172 64 l -6 -4 v 8 z"/>
    <path d="M 344 64 l -6 -4 v 8 z"/>
    <path d="M 516 64 l -6 -4 v 8 z"/>
  </g>
  <text x="330" y="118" font-size="10" fill="#666666" text-anchor="middle">示意图 · 实际以面板为准</text>
</svg>
