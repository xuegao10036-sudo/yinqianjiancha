<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="660" height="500" fill="#151517"/>
  <!-- 弹层 -->
  <rect x="110" y="10" width="440" height="480" rx="10" fill="#252526" stroke="#3a3a3a"/>
  <text x="130" y="40" font-size="14" font-weight="600" fill="#ffffff">设置</text>
  <text x="524" y="42" font-size="16" fill="#888888">×</text>

  <!-- 卡片开关 -->
  <text x="130" y="70" font-size="11" fill="#999999">卡片开关（勾掉 = 本轮不检查）· 右侧抓手可拖动排序</text>
  <g font-size="12">
    <rect x="130" y="80" width="13" height="13" rx="3" fill="#1f1f21" stroke="#4a4a4a"/><path d="M 133 86 l 3 3 l 5 -6" stroke="#4ec98a" stroke-width="1.6" fill="none"/><text x="152" y="91" fill="#d8d8d8">① 画板 · 出血 · 色彩</text>
    <rect x="130" y="106" width="13" height="13" rx="3" fill="#1f1f21" stroke="#4a4a4a"/><path d="M 133 112 l 3 3 l 5 -6" stroke="#4ec98a" stroke-width="1.6" fill="none"/><text x="152" y="117" fill="#d8d8d8">② 隐藏图层 · 对象</text>
    <rect x="130" y="132" width="13" height="13" rx="3" fill="#1f1f21" stroke="#4a4a4a"/><path d="M 133 138 l 3 3 l 5 -6" stroke="#4ec98a" stroke-width="1.6" fill="none"/><text x="152" y="143" fill="#d8d8d8">③ 字体 · 转曲</text>
    <rect x="130" y="158" width="13" height="13" rx="3" fill="#1f1f21" stroke="#4a4a4a"/><text x="152" y="169" fill="#777777">④ 图片嵌入（已关闭，卡片区显示灰色占位）</text>
    <rect x="130" y="184" width="13" height="13" rx="3" fill="#1f1f21" stroke="#4a4a4a"/><path d="M 133 190 l 3 3 l 5 -6" stroke="#4ec98a" stroke-width="1.6" fill="none"/><text x="152" y="195" fill="#d8d8d8">⑤ 图片分辨率</text>
    <rect x="130" y="210" width="13" height="13" rx="3" fill="#1f1f21" stroke="#4a4a4a"/><path d="M 133 216 l 3 3 l 5 -6" stroke="#4ec98a" stroke-width="1.6" fill="none"/><text x="152" y="221" fill="#d8d8d8">⑥ 油墨 · 描边粗细</text>
    <rect x="130" y="236" width="13" height="13" rx="3" fill="#1f1f21" stroke="#4a4a4a"/><path d="M 133 242 l 3 3 l 5 -6" stroke="#4ec98a" stroke-width="1.6" fill="none"/><text x="152" y="247" fill="#d8d8d8">⑦ 叠印</text>
  </g>
  <!-- 抓手点阵 -->
  <g fill="#8a8a8a">
    <circle cx="516" cy="84" r="1.6"/><circle cx="524" cy="84" r="1.6"/>
    <circle cx="516" cy="89" r="1.6"/><circle cx="524" cy="89" r="1.6"/>
    <circle cx="516" cy="94" r="1.6"/><circle cx="524" cy="94" r="1.6"/>
    <circle cx="516" cy="110" r="1.6"/><circle cx="524" cy="110" r="1.6"/>
    <circle cx="516" cy="115" r="1.6"/><circle cx="524" cy="115" r="1.6"/>
    <circle cx="516" cy="120" r="1.6"/><circle cx="524" cy="120" r="1.6"/>
    <circle cx="516" cy="136" r="1.6"/><circle cx="524" cy="136" r="1.6"/>
    <circle cx="516" cy="141" r="1.6"/><circle cx="524" cy="141" r="1.6"/>
    <circle cx="516" cy="146" r="1.6"/><circle cx="524" cy="146" r="1.6"/>
    <circle cx="516" cy="188" r="1.6"/><circle cx="524" cy="188" r="1.6"/>
    <circle cx="516" cy="193" r="1.6"/><circle cx="524" cy="193" r="1.6"/>
    <circle cx="516" cy="198" r="1.6"/><circle cx="524" cy="198" r="1.6"/>
    <circle cx="516" cy="214" r="1.6"/><circle cx="524" cy="214" r="1.6"/>
    <circle cx="516" cy="219" r="1.6"/><circle cx="524" cy="219" r="1.6"/>
    <circle cx="516" cy="224" r="1.6"/><circle cx="524" cy="224" r="1.6"/>
    <circle cx="516" cy="240" r="1.6"/><circle cx="524" cy="240" r="1.6"/>
    <circle cx="516" cy="245" r="1.6"/><circle cx="524" cy="245" r="1.6"/>
    <circle cx="516" cy="250" r="1.6"/><circle cx="524" cy="250" r="1.6"/>
  </g>

  <!-- 判定阈值 -->
  <text x="130" y="282" font-size="11" fill="#999999">判定阈值（默认值，均可修改）</text>
  <g font-size="12" fill="#d8d8d8">
    <text x="130" y="306">出血</text>
    <rect x="210" y="292" width="64" height="20" rx="6" fill="#1f1f21" stroke="#4a4a4a"/><text x="268" y="306" fill="#e6e6e6" text-anchor="end">3</text><text x="280" y="306" font-size="11" fill="#999999">mm</text>
    <text x="330" y="306">分辨率</text>
    <rect x="430" y="292" width="64" height="20" rx="6" fill="#1f1f21" stroke="#4a4a4a"/><text x="488" y="306" fill="#e6e6e6" text-anchor="end">300</text><text x="500" y="306" font-size="11" fill="#999999">ppi</text>

    <text x="130" y="338">极小字号</text>
    <rect x="210" y="324" width="64" height="20" rx="6" fill="#1f1f21" stroke="#4a4a4a"/><text x="268" y="338" fill="#e6e6e6" text-anchor="end">6</text><text x="280" y="338" font-size="11" fill="#999999">pt</text>
    <text x="330" y="338">描边</text>
    <rect x="430" y="324" width="64" height="20" rx="6" fill="#1f1f21" stroke="#4a4a4a"/><text x="488" y="338" fill="#e6e6e6" text-anchor="end">0.1</text><text x="500" y="338" font-size="11" fill="#999999">mm</text>

    <text x="130" y="370">油墨偏重</text>
    <rect x="210" y="356" width="64" height="20" rx="6" fill="#1f1f21" stroke="#4a4a4a"/><text x="268" y="370" fill="#e6e6e6" text-anchor="end">220</text>
    <text x="330" y="370">油墨超标</text>
    <rect x="430" y="356" width="64" height="20" rx="6" fill="#1f1f21" stroke="#4a4a4a"/><text x="488" y="370" fill="#e6e6e6" text-anchor="end">300</text>
  </g>
  <text x="130" y="396" font-size="11" fill="#777777">改动需点「确认」，再点「开始检查」后生效</text>

  <!-- 底部按钮 -->
  <rect x="130" y="414" width="90" height="30" rx="15" fill="#0e639c"/><text x="175" y="433" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">确认</text>
  <rect x="236" y="414" width="90" height="30" rx="15" fill="#2c2c2e" stroke="#4a4a4a"/><text x="281" y="433" font-size="12" fill="#d8d8d8" text-anchor="middle">重置默认</text>
  <rect x="342" y="414" width="70" height="30" rx="15" fill="#2c2c2e" stroke="#4a4a4a"/><text x="377" y="433" font-size="12" fill="#d8d8d8" text-anchor="middle">关闭</text>

  <text x="330" y="516" font-size="10" fill="#666666" text-anchor="middle">设置弹层示意图</text>
</svg>
