  <rect x="566" y="370" width="64" height="18" rx="9" fill="#4a1d1a"/><text x="598" y="383" font-size="11" fill="#f06a55" text-anchor="middle">超标 2 处</text>
  <text x="20" y="407" font-size="12" fill="#d8d8d8">[图形] 油墨总量 315 — C85 M80 Y75 K75 · 0.08mm ×3</text>

  <!-- 卡⑦ -->
  <rect x="10" y="428" width="640" height="52" rx="10" fill="#1b1b1c"/>
  <rect x="10" y="428" width="640" height="13" rx="10" fill="#2c2c2e"/>
  <rect x="10" y="441" width="640" height="13" fill="#2c2c2e"/>
  <text x="20" y="445" font-size="12" font-weight="600" fill="#d8d8d8">⑦ 叠印</text>
  <rect x="578" y="432" width="52" height="18" rx="9" fill="#333333"/><text x="604" y="445" font-size="11" fill="#4ec98a" text-anchor="middle">无叠印</text>
  <text x="20" y="469" font-size="12" fill="#999999">隐藏对象与图层不参与叠印检查。</text>

  <text x="330" y="516" font-size="10" fill="#666666" text-anchor="middle">示意图 · 数据为示例，实际以面板为准</text>
</svg>
