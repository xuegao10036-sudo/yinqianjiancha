  <text x="20" y="345" font-size="12" fill="#d8d8d8">R1.jpg — 188 ppi</text>

  <!-- 卡⑥ -->
  <rect x="10" y="366" width="640" height="52" rx="10" fill="#1b1b1c"/>
  <rect x="10" y="366" width="640" height="13" rx="10" fill="#2c2c2e"/>
  <rect x="10" y="379" width="640" height="13" fill="#2c2c2e"/>
