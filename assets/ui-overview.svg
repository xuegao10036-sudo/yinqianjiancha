  <rect x="10" y="180" width="640" height="52" rx="10" fill="#1b1b1c"/>
  <rect x="10" y="180" width="640" height="13" rx="10" fill="#2c2c2e"/>
  <rect x="10" y="193" width="640" height="13" fill="#2c2c2e"/>
