  <rect x="532" y="60" width="42" height="18" rx="9" fill="#333333"/><text x="553" y="73" font-size="11" fill="#4ec98a" text-anchor="middle">CMYK</text>
  <rect x="580" y="60" width="60" height="18" rx="9" fill="#4a3a14"/><text x="610" y="73" font-size="11" fill="#e8b93e" text-anchor="middle">出血不足</text>
  <text x="20" y="97" font-size="12" fill="#d8d8d8">画板 1 — 540 × 380 mm · 出血 上 0mm · 下 0mm · 右 2.9mm</text>

