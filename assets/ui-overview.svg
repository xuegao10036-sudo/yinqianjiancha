  <rect x="492" y="184" width="78" height="18" rx="9" fill="#4a1d1a"/><text x="531" y="197" font-size="11" fill="#f06a55" text-anchor="middle">未转曲 12 个</text>
  <rect x="576" y="184" width="64" height="18" rx="9" fill="#4a3a14"/><text x="608" y="197" font-size="11" fill="#e8b93e" text-anchor="middle">小字号 2</text>
